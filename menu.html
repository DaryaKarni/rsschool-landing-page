<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Menu</title>
  <link rel="icon" href="./assets/coffee-slider-1.png">
  <link rel="stylesheet" href="./styles/main.css">
</head>
<body>
  <div class="header-wrapper">
    <!-- here will be header -->
  </div>
  <main class="main-menu">
    <div class="menu">
      <div class="menu-offer">
        <h1 class="heading-2">
          Behind each of our cups hides an 
          <span class="heading-2 accent">amazing surprise</span>
        </h1>
        <div class="menu-tabs">

          <button class="tab-item active">
            <div class="icon-frame">
              <p>☕</p>
            </div>
            <p class="button">Coffee</p>
          </button>

          <button class="tab-item">
            <div class="icon-frame">
              <p>🫖</p>
            </div>
            <p class="button">Tea</p>
          </button>

          <button class="tab-item">
            <div class="icon-frame">
              <p>🍰</p>
            </div>
            <p class="button">Dessert</p>
          </button>

        </div>
      </div>
      <div class="menu-grid">
      </div>
      <div class="round-button button">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M21.8883 13.5C21.1645 18.3113 17.013 22 12 22C6.47715 22 2 17.5228 2 12C2 6.47715 6.47715 2 12 2C16.1006 2 19.6248 4.46819 21.1679 8" stroke="#403F3D" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M17 8H21.4C21.7314 8 22 7.73137 22 7.4V3" stroke="#403F3D" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
    </div>
  </main>
  <div class="footer-wrapper">
    <!-- here will be footer -->
  </div>
<script type="module" src="./src/layout.js"></script>
<script type="module" src="./src/cards.js"></script>
<script type="module" src="./src/theme.js"></script>
</body>
</html>
