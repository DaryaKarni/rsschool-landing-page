<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Menu</title>
  <link rel="icon" href="./assets/coffee-slider-1.png">
  <link rel="stylesheet" href="./styles/main.css">
</head>
<body>
  <div class="header-wrapper">
    <!-- here will be header -->
  </div>
  <main class="main-menu">
    <div class="menu">
      <div class="menu-offer">
        <h1 class="heading-2">
          Behind each of our cups hides an 
          <span class="heading-2 accent">amazing surprise</span>
        </h1>
        <div class="menu-tabs">

          <button class="tab-item active">
            <div class="icon-frame">
              <p>☕</p>
            </div>
            <p class="button">Coffee</p>
          </button>

          <button class="tab-item">
            <div class="icon-frame">
              <p>🫖</p>
            </div>
            <p class="button">Tea</p>
          </button>

          <button class="tab-item">
            <div class="icon-frame">
              <p>🍰</p>
            </div>
            <p class="button">Dessert</p>
          </button>

        </div>
      </div>
      <div class="menu-grid">

      </div>
    </div>
  </main>
  <div class="footer-wrapper">
    <!-- here will be footer -->
  </div>
<script type="module" src="./src/layout.js"></script>
<script type="module" src="./src/cards.js"></script>
</body>
</html>
